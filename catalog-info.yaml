      version: "1.0.0"
    channels:
      /inbound/instructions/{date}:
        subscribe:
          summary: Batch payment instruction file (CSV)
      /inbound/corrections/{date}:
        subscribe:
          summary: Payment correction file (ISO 20022 pain.002)
