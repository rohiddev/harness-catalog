# --- FTP Outbound ---
apiVersion: harness.io/v1
kind: API
identifier: payments_ftp_outbound
name: payments-ftp-outbound
type: asyncapi
owner: group:account/team-payments
metadata:
  title: Payments FTP Outbound
  description: >
    End-of-day settlement and reconciliation files deposited by payments-service.
    PGP-encrypted, delivered by 23:00 local time.
  annotations:
    bank.com/sysid: SYSID-00000
    github.com/project-slug: bank-org/payments-service
  tags:
    - ftp
    - asyncapi
    - file-transfer
    - producer
    - sysid-00000
spec:
  lifecycle: production
  system:
    - system:account/payments_platform
  definition: |
    asyncapi: "2.6.0"
    info:
      title: Payments FTP Outbound
      version: "1.0.0"
    channels:
      /outbound/settlement/{date}:
        publish:
          summary: Daily settlement file (CSV)
      /outbound/reconciliation/{date}:
        publish:
          summary: Daily reconciliation report (ISO 20022 camt.053)

---

# --- FTP Inbound ---
apiVersion: harness.io/v1
kind: API
identifier: payments_ftp_inbound
name: payments-ftp-inbound
type: asyncapi
owner: group:account/team-payments
metadata:
  title: Payments FTP Inbound
  description: >
    Batch payment instruction files read from FTP. Deposited by corporate
    clients and third-party originators. Processed at 06:00 and 12:00 daily.
  annotations:
    bank.com/sysid: SYSID-00000
    github.com/project-slug: bank-org/payments-service
  tags:
    - ftp
    - asyncapi
    - file-transfer
    - consumer
    - sysid-00000
spec:
  lifecycle: production
