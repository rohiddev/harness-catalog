# --- PostgreSQL Database ---
apiVersion: harness.io/v1
kind: Resource
identifier: payments_postgres
name: payments-postgres
type: database
owner: group:account/team-payments
metadata:
  title: Payments PostgreSQL DB
  description: >
    Primary transactional store for payments-service. PostgreSQL 14 on AWS RDS.
    Multi-AZ deployment with automated failover. 35-day backup retention.
    Stores payment records, transaction history and reconciliation data.
  annotations:
    bank.com/sysid: SYSID-00000
  tags:
    - postgresql
    - rds
    - database
    - tier-1
    - sysid-00000
spec:
  system:
    - system:account/payments_platform

---

# --- Redis Cache ---
apiVersion: harness.io/v1
kind: Resource
identifier: payments_redis
name: payments-redis
type: cache
owner: group:account/team-payments
metadata:
  title: Payments Redis Cache
  description: >
    Session and idempotency cache for payments-service. Redis 7 on AWS ElastiCache.
    2 read replicas, in-transit encryption. Used for deduplication keys,
    rate-limit counters and short-lived payment state.
  annotations:
    bank.com/sysid: SYSID-00000
  tags:
    - redis
    - elasticache
    - cache
    - sysid-00000
spec:
  system:
    - system:account/payments_platform

---

# --- Kafka Cluster ---
apiVersion: harness.io/v1
kind: Resource
identifier: payments_kafka
name: payments-kafka
type: messaging-queue
owner: group:account/team-payments
metadata:
  title: Payments Kafka Cluster
  description: >
    Dedicated Kafka cluster for payments event streaming. SASL/SCRAM-SHA-256
    authentication, TLS in transit. Managed by the platform team via Confluent
    Control Center. Hosts payment lifecycle event topics consumed by fraud,
    ledger and notification services.
  annotations:
    bank.com/sysid: SYSID-00000
  tags:
    - kafka
    - messaging
    - events
    - sysid-00000
spec:
  system:
    - system:account/payments_platform

---

# --- IBM MQ Broker ---
apiVersion: harness.io/v1
kind: Resource
identifier: payments_mq
name: payments-mq
type: messaging-queue
owner: group:account/team-payments
metadata:
  title: Payments IBM MQ Broker
  description: >
    Enterprise message broker for payments-service. IBM MQ over AMQP (port 5672).
    User/password authentication. Handles payment instructions from corporate
    banking channels and settlement notifications to the settlement engine.
  annotations:
    bank.com/sysid: SYSID-00000
  tags:
    - ibm-mq
    - amqp
    - messaging
    - sysid-00000
spec:
  system:
    - system:account/payments_platform

---

# --- FTP Server ---
apiVersion: harness.io/v1
kind: Resource
identifier: payments_ftp
name: payments-ftp
type: ftp-server
owner: group:account/team-payments
metadata:
  title: Payments FTP Server
  description: >
    Secure FTP server for batch file exchange with third-party payment processors
    and settlement partners. SFTP over SSH. Used for end-of-day settlement files,
    payment instruction batches and reconciliation reports.
  annotations:
    bank.com/sysid: SYSID-00000
  tags:
    - ftp
    - sftp
    - file-transfer
    - sysid-00000
