# =============================================================================
# 3. COMPONENT
# =============================================================================
apiVersion: harness.io/v1
kind: Component
identifier: payments_service
name: payments-service
type: service
owner: group:account/team-payments
metadata:
  title: Payments Service
  description: >
    Core payments processing service. Validates and initiates payment transactions,
    applies fraud screening rules, posts to the ledger and publishes payment
    lifecycle events. Handles REST API requests from frontend and batch payment
    instructions from FTP. Does NOT handle authentication — delegated to auth-service.
  annotations:
    # Source control
    github.com/project-slug: bank-org/payments-service

    # TechDocs — served from repo root
    backstage.io/techdocs-ref: dir:.

    # Source location — drives Code tab
    backstage.io/source-location: url:https://github.com/bank-org/payments-service/tree/master/

    # Harness CI/CD
    harness.io/project-url: https://app.harness.io/ng/account/ACCOUNT_ID/module/ci/orgs/default/projects/SYSID-00000/pipelines
    harness.io/pipelines: payments-deploy,payments-ci

    # Observability
    datadoghq.com/dashboard-url: https://app.datadoghq.com/dashboard/payments

    # Code quality
    sonarqube.org/project-key: payments-service

    # Tracking
    jira/project-key: PAY

    # CMDB correlation
    bank.com/sysid: SYSID-00000

  tags:
    - java
    - spring-boot
    - payments
    - tier-1
    - sysid-00000

  links:
    - url: https://runbooks.bank.com/payments-service
      title: Runbook
      icon: book
    - url: https://app.datadoghq.com/dashboard/payments
      title: Datadog
      icon: dashboard
    - url: https://sonar.bank.com/project?id=payments-service
      title: SonarQube
      icon: quality
    - url: https://confluence.bank.com/display/PAY/payments-service
      title: Confluence
      icon: docs
    - url: https://oncall.bank.com/payments
      title: On-Call Schedule
      icon: group
    - url: https://jira.bank.com/projects/PAY
      title: Jira
      icon: bug

spec:
  lifecycle: production
  system:
    - system:account/payments_platform
  providesApis:
    - payments-rest-api
    - payments-kafka-producer
    - payments-mq-producer
    - payments-ftp-outbound
  consumesApis:
    - auth-api
    - fraud-detection-api
    - ledger-api
    - payments-kafka-consumer
    - payments-mq-consumer
    - payments-ftp-inbound
  dependsOn:
    - resource:account/payments_postgres
    - resource:account/payments_redis
    - resource:account/payments_kafka
    - resource:account/payments_mq
    - resource:account/payments_ftp

