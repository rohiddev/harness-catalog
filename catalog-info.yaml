apiVersion: harness.io/v1
kind: System
identifier: payments_platform
name: payments-platform
type: system
owner: group:account/team-payments
metadata:
  title: Payments Platform
  description: >
    End-to-end payments processing platform covering payment initiation,
    fraud screening, ledger posting and settlement. Processes all retail
    and corporate payment flows including SWIFT, SEPA, domestic wire and
    FTP-based batch settlement files.
  tags:
    - payments
    - core-banking
    - tier-1
    - sysid-00000
  annotations:
    # CMDB — REQUIRED
    bank.com/sysid: SYSID-00000
    bank.com/tier: tier-1
    bank.com/owner-email: team-payments@bank.com

    # Telemetry — platform-wide dashboards (all services in this system)
    datadoghq.com/system-dashboard-url: "https://app.datadoghq.com/dashboard/payments-platform-overview"
    dynatrace.com/system-dashboard-url: "https://bank.live.dynatrace.com/#dashboard;id=payments-platform"

    # Kubernetes — clusters this platform spans (informational — shown in EntityAdditionalInfoCard)
    kubernetes/clusters: prod-eks-us-east-1,dr-eks-us-west-2

    # Rafay — fleet management for SRE (Rafay Kubernetes Ops Platform plugin)
    # Enable plugin in IDP marketplace + configure Rafay API credentials before uncommenting
    # System maps to a Rafay project — shows all clusters + namespaces in this platform
    # rafay.dev/project-name: payments-platform

    # Wiz — platform-level security posture across all payments cloud resources
    wiz.io/project-id: payments-platform-prod

    # On-call — platform-level (who owns the system, not individual services)
    oncall/team: payments-platform-sre
    oncall/rotation-url: https://servicenow.bank.com/oncall/payments-platform
    oncall/incidents-url: https://servicenow.bank.com/incidents?platform=payments

    # ── Auto-written by pipelines — DO NOT fill manually ──────────────────
