# =============================================================================
# 4. APIs
# =============================================================================

# --- REST API ---
apiVersion: harness.io/v1
kind: API
identifier: payments_rest_api
name: payments-rest-api
type: openapi
owner: group:account/team-payments
metadata:
  title: Payments REST API
  description: >
    REST API for payment initiation, status queries and refunds. Protected by
    OAuth2 client credentials. Rate limited to 1000 req/min per client.
    Callers: mobile-banking-app, internet-banking, corporate-portal.
  annotations:
    bank.com/sysid: SYSID-00000
    github.com/project-slug: bank-org/payments-service
  tags:
    - rest
    - openapi
    - payments
    - oauth2
    - sysid-00000
  links:
    - url: https://api-docs.bank.com/payments
      title: API Docs
      icon: docs
spec:
  lifecycle: production
  system:
    - system:account/payments_platform
  definition: |
    openapi: "3.0.0"
    info:
      title: Payments API
      version: "2.1.0"
    servers:
      - url: https://api.bank.com/payments
    paths:
      /v2/payments:
        post:
          operationId: initiatePayment
          summary: Initiate a payment
      /v2/payments/{id}:
        get:
          operationId: getPaymentStatus
          summary: Get payment status
      /v2/payments/{id}/refund:
        post:
          operationId: refundPayment
          summary: Refund a payment

---

# --- Kafka Producer ---
apiVersion: harness.io/v1
kind: API
identifier: payments_kafka_producer
name: payments-kafka-producer
type: asyncapi
owner: group:account/team-payments
metadata:
  title: Payments Kafka Producer
  description: >
    Payment lifecycle events published by payments-service to Kafka.
    Topics: payment-initiated, payment-completed, payment-failed.
  annotations:
    bank.com/sysid: SYSID-00000
    github.com/project-slug: bank-org/payments-service
  tags:
    - kafka
    - asyncapi
    - events
    - producer
    - sysid-00000
spec:
  lifecycle: production
  system:
    - system:account/payments_platform
  definition: |
    asyncapi: "2.6.0"
    info:
      title: Payments Kafka Producer
      version: "1.0.0"
    channels:
      payments.events.payment-initiated:
        publish:
          summary: Payment initiated event
      payments.events.payment-completed:
        publish:
          summary: Payment completed event
      payments.events.payment-failed:
        publish:
          summary: Payment failed event

