  annotations:
    bank.com/sysid: SYSID-00000
    bank.com/tier: tier-1
    bank.com/owner-email: team-payments@bank.com
    github.com/project-slug: bank-org/payments-service
  tags:
    - ftp
    - asyncapi
    - file-transfer
    - consumer
    - sysid-00000
spec:
  lifecycle: production
  system: payments_platform
  definition: |
    asyncapi: "2.6.0"
    info:
      title: Payments FTP Inbound
      version: "1.0.0"
      description: Batch payment instruction files read by payments-service from FTP.
    servers:
      production:
        url: ftp.bank.com
        protocol: sftp
        description: Production SFTP server
    channels:
      /inbound/instructions/{date}:
        description: >
          Batch payment instruction files deposited by corporate clients.
          Processed at 06:00 and 12:00 daily.
        parameters:
          date:
            description: Business date in YYYYMMDD format
            schema:
              type: string
        subscribe:
          summary: Consume batch payment instructions
          message:
            name: BatchInstructionFile
            contentType: text/csv
            payload:
              type: object
              description: >
                CSV columns: instruction_id, amount, currency, source_account,
                destination_account, value_date, reference, priority
      /inbound/corrections/{date}:
        description: Correction files for previously submitted payment batches
        parameters:
          date:
            description: Business date in YYYYMMDD format
            schema:
              type: string
        subscribe:
          summary: Consume payment correction file
          message:
            name: CorrectionFile
            contentType: application/xml
            payload:
              type: object
              description: >
                ISO 20022 pain.002 format. Contains rejection and return
                notifications for previously submitted instructions.

