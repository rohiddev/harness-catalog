apiVersion: harness.io/v1
kind: API
identifier: payments_kafka_consumer
name: payments-kafka-consumer
type: asyncapi
owner: group:account/team-payments
metadata:
  title: Payments Kafka Consumer
  description: >
    Kafka topics consumed by payments-service. Subscribes to fraud decisions
    from fraud-detection-service to gate payment completion.
  annotations:
    bank.com/sysid: SYSID-00000
    bank.com/tier: tier-1
    bank.com/owner-email: team-payments@bank.com
    github.com/project-slug: bank-org/payments-service
  tags:
    - kafka
    - asyncapi
    - events
    - consumer
    - sysid-00000
spec:
  lifecycle: production
  system: payments_platform
  definition: |
    asyncapi: "2.6.0"
    info:
      title: Payments Kafka Consumer
      version: "1.0.0"
      description: Kafka topics consumed by payments-service.
    servers:
      production:
        url: kafka.bank.com:9092
        protocol: kafka
        description: Production Kafka cluster
        security:
          - saslScram: []
    channels:
      fraud.events.fraud-decision:
        description: >
          Fraud decisions from fraud-detection-service. payments-service
          gates payment completion on APPROVED decisions.
        subscribe:
          summary: Consume fraud decision
          bindings:
            kafka:
              topic: fraud.events.fraud-decision
              groupId: payments-fraud-decision-consumer
          message:
            name: FraudDecision
            contentType: application/json
            payload:
              type: object
              required: [paymentId, decision, occurredAt]
              properties:
                paymentId:
                  type: string
                decision:
                  type: string
                  enum: [APPROVED, REJECTED, REVIEW]
                score:
                  type: number
                  description: Fraud risk score 0-100
                occurredAt:
                  type: string
                  format: date-time
    components:
      securitySchemes:
        saslScram:
          type: scramSha256
          description: SASL/SCRAM-SHA-256 authentication

