apiVersion: harness.io/v1
kind: Resource
identifier: payments_ibmmq
name: payments-ibmmq
type: ibm-mq
owner: group:account/team-payments
metadata:
  title: Payments IBM MQ Broker
  description: >
    Enterprise message broker for payments-service. IBM MQ over AMQP (port 5672).
    User/password authentication. Handles payment instructions from corporate
    banking channels and settlement notifications to the settlement engine.
  annotations:
    bank.com/sysid: SYSID-00000
    bank.com/tier: tier-1
    bank.com/owner-email: team-payments@bank.com
    mq/host: mqserver.bank.com:1414
    mq/queue-manager: QM_PAYMENTS
    mq/channel: PAYMENTS.SVRCONN
  tags:
    - ibm-mq
    - amqp
    - messaging
    - sysid-00000
spec:
  system: system:account/payments_platform
