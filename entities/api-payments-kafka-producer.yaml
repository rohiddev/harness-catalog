apiVersion: harness.io/v1
kind: API
identifier: payments_kafka_producer
name: payments-kafka-producer
type: asyncapi
owner: group:account/team-payments
metadata:
  title: Payments Kafka Producer
  description: >
    Payment lifecycle events published by payments-service to Kafka.
    Downstream consumers: fraud-detection-service, ledger-service,
    notification-service. Events published on every payment state transition.
  annotations:
    bank.com/sysid: SYSID-00000
    bank.com/tier: tier-1
    bank.com/owner-email: team-payments@bank.com
    github.com/project-slug: bank-org/payments-service
  tags:
    - kafka
    - asyncapi
    - events
    - producer
    - sysid-00000
spec:
  lifecycle: production
  system:
    - system:account/payments_platform
  definition: |
    asyncapi: "2.6.0"
    info:
      title: Payments Kafka Producer
      version: "1.0.0"
      description: Payment lifecycle events published by payments-service.
    servers:
      production:
        url: kafka.bank.com:9092
        protocol: kafka
        description: Production Kafka cluster
        security:
          - saslScram: []
    channels:
      payments.events.payment-initiated:
        description: Published when a payment is accepted and queued for processing
        publish:
          summary: Payment initiated event
          bindings:
            kafka:
              topic: payments.events.payment-initiated
              partitions: 12
              replicas: 3
          message:
            name: PaymentInitiated
            contentType: application/json
            payload:
              type: object
              required: [eventId, paymentId, amount, currency, occurredAt]
              properties:
                eventId:
                  type: string
                  description: Unique event ID (UUID)
                paymentId:
                  type: string
                  description: Payment reference ID
                amount:
                  type: number
                currency:
                  type: string
                status:
                  type: string
                  enum: [INITIATED]
                occurredAt:
                  type: string
                  format: date-time
      payments.events.payment-completed:
        description: Published when a payment is successfully settled
        publish:
          summary: Payment completed event
          bindings:
            kafka:
              topic: payments.events.payment-completed
              partitions: 12
              replicas: 3
          message:
            name: PaymentCompleted
            contentType: application/json
            payload:
              type: object
              required: [eventId, paymentId, occurredAt]
              properties:
                eventId:
                  type: string
                paymentId:
                  type: string
                status:
                  type: string
                  enum: [COMPLETED]
                occurredAt:
                  type: string
                  format: date-time
      payments.events.payment-failed:
        description: Published when a payment fails processing or fraud screening
        publish:
          summary: Payment failed event
          bindings:
            kafka:
              topic: payments.events.payment-failed
              partitions: 12
              replicas: 3
          message:
            name: PaymentFailed
            contentType: application/json
            payload:
              type: object
              required: [eventId, paymentId, reason, occurredAt]
              properties:
                eventId:
                  type: string
                paymentId:
                  type: string
                reason:
                  type: string
                  description: Failure reason code
                occurredAt:
                  type: string
                  format: date-time
    components:
      securitySchemes:
        saslScram:
          type: scramSha256
          description: SASL/SCRAM-SHA-256 authentication
