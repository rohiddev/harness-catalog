apiVersion: harness.io/v1
kind: Resource
identifier: payments_redis
name: payments-redis
type: cache
owner: group:account/team-payments
metadata:
  title: Payments Redis Cache
  description: >
    Session and idempotency cache for payments-service. Redis 7 on AWS ElastiCache.
    2 read replicas, in-transit encryption. Used for deduplication keys,
    rate-limit counters and short-lived payment state.
  annotations:
    bank.com/sysid: SYSID-00000
  tags:
    - redis
    - elasticache
    - cache
    - sysid-00000
spec:
  system:
    - system:account/payments_platform
