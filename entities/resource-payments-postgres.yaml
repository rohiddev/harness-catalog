apiVersion: harness.io/v1
kind: Resource
identifier: payments_postgres
name: payments-postgres
type: database
owner: group:account/team-payments
metadata:
  title: Payments PostgreSQL DB
  description: >
    Primary transactional store for payments-service. PostgreSQL 14 on AWS RDS.
    Multi-AZ deployment with automated failover. 35-day backup retention.
    Stores payment records, transaction history and reconciliation data.
  annotations:
    bank.com/sysid: SYSID-00000
    bank.com/tier: tier-1
    bank.com/owner-email: team-payments@bank.com
    db/engine: postgresql
    db/schema: payments
    db/dba-runbook-url: https://runbooks.bank.com/payments-service/dba
    db/last-migration: "2026-04-15"
    db/backup-policy: daily-30d
  tags:
    - postgresql
    - rds
    - database
    - tier-1
    - sysid-00000
spec:
  system: system:account/payments_platform
