apiVersion: harness.io/v1
kind: API
identifier: payments_mq_consumer
name: payments-mq-consumer
type: asyncapi
owner: group:account/team-payments
metadata:
  title: Payments MQ Consumer
  description: >
    Enterprise MQ queues consumed by payments-service. Reads inbound payment
    instructions from corporate banking channels and third-party payment
    gateways via IBM MQ.
  annotations:
    bank.com/sysid: SYSID-00000
    bank.com/tier: tier-1
    bank.com/owner-email: team-payments@bank.com
    github.com/project-slug: bank-org/payments-service
  tags:
    - ibm-mq
    - asyncapi
    - amqp
    - consumer
    - sysid-00000
spec:
  lifecycle: production
  system: payments_platform
  definition: |
    asyncapi: "2.6.0"
    info:
      title: Payments MQ Consumer
      version: "1.0.0"
      description: Enterprise MQ queues consumed by payments-service.
    servers:
      production:
        url: mq.bank.com:5672
        protocol: amqp
        description: Production IBM MQ broker
        security:
          - userPassword: []
    channels:
      payments/instructions/inbound:
        description: >
          Inbound payment instructions from corporate banking channels
          and third-party payment gateways.
        subscribe:
          summary: Consume inbound payment instruction
          bindings:
            amqp:
              is: queue
              queue:
                name: PAYMENTS.INSTRUCTIONS.INBOUND
                durable: true
                exclusive: false
                autoDelete: false
          message:
            name: InboundPaymentInstruction
            contentType: application/json
            payload:
              type: object
              required: [instructionId, amount, currency, sourceAccount, destinationAccount]
              properties:
                instructionId:
                  type: string
                amount:
                  type: number
                currency:
                  type: string
                sourceAccount:
                  type: string
                destinationAccount:
                  type: string
                channel:
                  type: string
                  enum: [CORPORATE_BANKING, THIRD_PARTY_GATEWAY, BATCH]
    components:
      securitySchemes:
        userPassword:
          type: userPassword
          description: IBM MQ user/password authentication
