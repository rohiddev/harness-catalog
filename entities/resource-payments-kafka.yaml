apiVersion: harness.io/v1
kind: Resource
identifier: payments_kafka
name: payments-kafka
type: messaging-queue
owner: group:account/team-payments
metadata:
  title: Payments Kafka Cluster
  description: >
    Dedicated Kafka cluster for payments event streaming. SASL/SCRAM-SHA-256
    authentication, TLS in transit. Managed by the platform team via Confluent
    Control Center. Hosts payment lifecycle event topics consumed by fraud,
    ledger and notification services.
  annotations:
    bank.com/sysid: SYSID-00000
  tags:
    - kafka
    - messaging
    - events
    - sysid-00000
spec:
  system:
    - system:account/payments_platform
