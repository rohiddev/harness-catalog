page:
  name: EntityLayout
  tabs:

    - name: Overview
      path: /
      title: Overview
      contents:
        - component: EntityOrphanWarning
        - component: EntityRelationWarning
        - component: EntityProcessingErrorsPanel

        - component: EntityAboutCard
          specs:
            props:
              variant: gridItem
            gridProps:
              md: 6

        - component: EntityLinksCard
          specs:
            props:
              variant: gridItem
            gridProps:
              md: 6

        - component: EntityAdditionalInfoCard
          gridProps:
            md: 6
          specs:
            title: IBM MQ Broker
            items:
              - label: Host
                value: <+metadata.annotations["mq/host"]>
                type: text
              - label: Queue Manager
                value: <+metadata.annotations["mq/queue-manager"]>
                type: text
              - label: Channel
                value: <+metadata.annotations["mq/channel"]>
                type: text

    - name: Dependencies
      path: /dependencies
      title: Dependencies
      contents:
        - component: EntityDependsOnComponentsCard
          specs:
            props:
              variant: gridItem
            gridProps:
              md: 12
