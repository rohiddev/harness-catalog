page:
  name: EntityLayout
  tabs:

    - name: Overview
      path: /
      title: Overview
      contents:
        - component: EntityOrphanWarning
        - component: EntityRelationWarning
        - component: EntityProcessingErrorsPanel

        - component: EntityAboutCard
          specs:
            props:
              variant: gridItem
            gridProps:
              md: 6

        - component: EntityLinksCard
          specs:
            props:
              variant: gridItem
            gridProps:
              md: 6

        - component: EntityAdditionalInfoCard
          gridProps:
            md: 6
          specs:
            title: Kafka Cluster
            items:
              - label: Bootstrap Servers
                value: <+metadata.annotations["kafka/bootstrap-servers"]>
                type: text

    - name: Dependencies
      path: /dependencies
      title: Dependencies
      contents:
        - component: EntityDependsOnComponentsCard
          specs:
            props:
              variant: gridItem
            gridProps:
              md: 12
